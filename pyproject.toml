[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaoca-pipeline"
version = "0.1.0"
description = "Local and provenance-preserving AAOCA text preprocessing"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
ocr = ["rapidocr>=3.9,<4", "onnxruntime>=1.20,<2", "opencv-python>=4.10,<5"]

[project.scripts]
aaoca-pipeline = "aaoca_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
